name: Release

# Packs the mod into an installable .zip. What happens to it depends on where
# the push landed:
#
#   any branch            the archive and the shim come back as run artifacts,
#                         and nothing is published. This is how you find out
#                         whether the Windows half compiles before merging it.
#   the default branch    plus a ROLLING `latest` pre-release, replaced every
#                         push, so there is always one URL holding a current
#                         test build.
#   workflow_dispatch     on the default branch, a real versioned vX.Y.Z
#                         release (see Versioning). On any other branch it
#                         is a build and nothing more, which is how you test
#                         this file without publishing anything.
#
# The rolling release is a PRE-RELEASE and deliberately: it is whatever was on
# the branch twenty minutes ago, not something anybody chose to ship.
#
# Archive layout: every mod file at the archive root, manifest.json included.
# That is one of the two shapes the game accepts on MODS > Import mod .zip
# (src/mods/LauncherMods.lua locateRoot: manifest at the root, or inside a
# single top-level folder). Nothing else is added, so the archive stays
# installable by hand too.
#
# Versioning applies to the versioned release only -- a rolling build is
# stamped with manifest.json's own version and nothing else, because bumping
# a version is a decision and pushing a commit is not. First rule that
# applies wins:
#   1. the "version" input of a manual run,
#   2. "[release X.Y.Z]" anywhere in the commit message,
#   3. manifest.json's own version, when it is ahead of every existing tag,
#      so bumping the manifest is the normal way to cut a release,
#   4. otherwise the newest vX.Y.Z tag with its patch incremented
#      (0.2.99 rolls over to 0.3.0).
# Whichever wins is written into the manifest.json inside the archive, so a
# shipped mod never reports a different version than the release it came from.
#
# Generated by: python3 tools/modkit.py add-release-workflow <mod-id>
# MOD_ID below is stamped to this mod's id when the file is copied.

# No paths-ignore, deliberately. It used to be here to stop a docs-only push
# cutting a release -- but nothing a PUSH does can cut a release any more
# (see the gates on the release job), so all it achieved was that a change to
# THIS FILE could never be tested by pushing it, which cost two runs to
# notice. Refreshing a rolling pre-release after a documentation commit is
# free and harmless; not being able to test the workflow is neither.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release (e.g. 0.3.0). Leave blank to auto-resolve."
        required: false
        default: ""

permissions:
  contents: write

# Per REF, not global. One group for the whole workflow meant a branch build
# queued behind a release and behind every other branch; the only runs that
# genuinely must not overlap are two of the same ref.
#
# And NOT cancel-in-progress, which is the usual choice for a rolling build
# and is wrong here: the rolling release is published by deleting `latest`
# and recreating it, and a run cancelled inside that window leaves the
# repository with no `latest` at all. Two pushes in a minute cost a queued
# job; a cancelled one costs the download link.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The one compiled thing in this repository: an MSVC bridge between the mod's
  # LuaJIT FFI and the Simulated Reality OpenGL weaver (see leiasr_shim/). It
  # cannot be built on the Ubuntu runner that packs the archive, so it is built
  # here and handed over as an artifact.
  #
  # Every failure here is SOFT. `continue-on-error`, and a release job that
  # needs it but runs `if: always()`, mean a missing PAT, an SDK that moved or
  # a compiler that changed its mind costs the release its LEIA rung and
  # nothing else. Every other 3D format is pure Lua and a shader.
  shim:
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # bo3b/SR-lib is PRIVATE, and two details of fetching it are
      # load-bearing:
      #
      #   actions/checkout writes an http.https://github.com/.extraheader
      #   holding a token scoped to THIS repository, and git applies it to
      #   every github.com URL -- including a third-party one, which then 401s.
      #   It has to come out before the PAT goes in, or the PAT looks broken.
      #
      #   the insteadOf rewrite has to be --global. `git submodule update`
      #   spawns a SEPARATE `git clone` process, which reads global and system
      #   config and never the parent repository's local config; with --local
      #   the rewrite is silently ignored, the clone goes out unauthenticated,
      #   and the job HANGS on a credential prompt rather than failing.
      - name: Fetch SR-lib
        id: srlib
        shell: bash
        env:
          SUBMODULE_PAT: ${{ secrets.SHARED_PAT || secrets.SUBMODULE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${SUBMODULE_PAT:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SHARED_PAT/SUBMODULE_PAT secret is set, so the SR SDK cannot be fetched and this release will ship without the LEIA rung. Every other 3D mode is unaffected."
            exit 0
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          # The gitlink is the normal route. It is also the one thing in this
          # repository that a plain `git add -A` in a tree with no submodules
          # checked out will quietly stage as a deletion -- so if it has gone
          # missing, clone the URL .gitmodules names rather than failing over
          # a piece of index bookkeeping.
          if git submodule status libs/SR-lib >/dev/null 2>&1; then
            git submodule update --init libs/SR-lib
          else
            echo "::warning::libs/SR-lib is not a registered submodule; cloning it from .gitmodules instead. The SDK version is then whatever is on the branch rather than the pinned commit."
            url="$(git config -f .gitmodules --get submodule.libs/SR-lib.url)"
            git clone --depth 1 "$url" libs/SR-lib
          fi
          git config --global --remove-section url."https://x-access-token:${SUBMODULE_PAT}@github.com/" || true
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build the shim
        if: steps.srlib.outputs.available == 'true'
        run: |
          cmake -S leiasr_shim -B leiasr_shim/build -A x64
          cmake --build leiasr_shim/build --config Release

      # Every SR DLL must be DELAY-loaded, or leiasr_shim.dll refuses to load
      # at all on a machine with no SR runtime -- which is most machines, and
      # the failure is a Windows loader dialog naming a library the mod has
      # never heard of. Cheap to check, miserable to discover in the wild.
      - name: Check the delay-load list held
        if: steps.srlib.outputs.available == 'true'
        shell: pwsh
        run: |
          $dll = "leiasr_shim/build/Release/leiasr_shim.dll"

          # dumpbin ships INSIDE the MSVC toolchain and is not on PATH in a
          # plain shell -- only inside a Visual Studio developer prompt. So it
          # is located the way everything else locates VS: vswhere, which is
          # at a fixed path on every runner with VS on it.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = $null
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -property installationPath
            if ($vs) {
              # -like and not -match, because \x64 is a HEX ESCAPE in a .NET
              # regex -- \x followed by two hex digits -- so 'Hostx64\\x64'
              # asks for a backslash followed by the character 0x64, which is
              # 'd'. It matches nothing, silently, and the step then skips
              # itself with a warning that looks like a missing toolchain.
              # A directory happening to be named like an escape sequence is
              # not a thing to solve with a better regex.
              $dumpbin = Get-ChildItem -LiteralPath "$vs\VC\Tools\MSVC" `
                            -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue |
                         Where-Object { $_.FullName -like '*\HostX64\x64\*' } |
                         Sort-Object FullName -Descending |
                         Select-Object -First 1 -ExpandProperty FullName
            }
          }

          # Not finding it is a WARNING and not a failure. This step is a
          # safety net over a DLL that has already been built; losing the net
          # should cost the run its certainty, never its artifact.
          if (-not $dumpbin) {
            Write-Warning "dumpbin not found -- skipping the delay-load check"
            exit 0
          }
          Write-Host "using $dumpbin"

          $out = & $dumpbin /imports $dll
          $text = $out -join "`n"
          $hard = ($text -split "Section contains the following delay load imports")[0]
          $bad = [regex]::Matches($hard, '(?im)^\s{4}(\S+\.dll)') |
                 ForEach-Object { $_.Groups[1].Value } |
                 Where-Object { $_ -notmatch '^(KERNEL32|OPENGL32|USER32|ADVAPI32|api-ms-win-)' }
          if ($bad) {
            Write-Error "hard-linked, should be delay-loaded: $($bad -join ', ')"
            exit 1
          }
          Write-Host "no hard SR imports"

          # And that the C surface the mod actually calls is all there. This
          # is not paranoia about the compiler: the exports are the ENTIRE
          # contract between an MSVC DLL and a LuaJIT mod that share no build,
          # no headers and no release, and a shim missing one of them fails at
          # the point of use -- silently, as "LeiaSR unavailable", on somebody
          # else's machine. Adding an export means adding it here too, which
          # is the point.
          $exports = (& $dumpbin /exports $dll) -join "`n"
          $missing = @('srk_init','srk_weave','srk_lens','srk_shutdown') |
                     Where-Object { $exports -notmatch "\b$_\b" }
          if ($missing) {
            Write-Error "leiasr_shim.dll is missing exports: $($missing -join ', ')"
            exit 1
          }
          Write-Host "all four srk_* exports present"

      - uses: actions/upload-artifact@v4
        if: steps.srlib.outputs.available == 'true'
        with:
          name: leiasr-shim
          path: leiasr_shim/build/Release/leiasr_shim.dll
          if-no-files-found: error

  # Packs the archive on every branch; what gets published is the two flags
  # below and nothing else decides it.
  #
  # The branch is asked for by NAME rather than hardcoded, and that is a fix
  # rather than a flourish: this workflow shipped naming `master`, there has
  # never been a `master` in this repository -- the default is `dev` -- and so
  # the push trigger had never once fired in its life. Every release to date
  # came from somebody running it by hand. Reading the default branch off the
  # event cannot drift that way again.
  release:
    runs-on: ubuntu-latest
    # the shim is optional payload, never a gate: always() runs this job
    # whether the Windows one succeeded, failed or was skipped outright
    needs: shim
    if: always()
    env:
      # a rolling test build: the default branch moved
      ROLLING: ${{ github.event_name == 'push'
                   && github.ref_name == github.event.repository.default_branch }}
      # and a real release: somebody asked for one, by hand, on purpose, ON
      # THE BRANCH RELEASES COME FROM. The branch test is not ceremony --
      # without it, running this by hand from a feature branch to see whether
      # it works publishes a versioned release of that branch, which is a
      # surprising way to find out that it works.
      VERSIONED: ${{ github.event_name == 'workflow_dispatch'
                     && github.ref_name == github.event.repository.default_branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, sys

          SEMVER = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True).stdout.strip()

          def parse(text):
              m = SEMVER.match(text)
              return tuple(int(p) for p in m.groups()) if m else None

          def die(msg):
              print(f"::error::{msg}", file=sys.stderr)
              raise SystemExit(1)

          with open("manifest.json", encoding="utf-8") as fh:
              manifest_version = str(json.load(fh).get("version", ""))

          released = sorted(
              v for v in (parse(tag[1:]) for tag in sh("git", "tag", "-l", "v*").splitlines()) if v
          )
          latest = released[-1] if released else None

          manifest_ver_parsed = parse(manifest_version)

          # A rolling build is not a release and does not get to invent a
          # version number. It ships manifest.json's own, untouched -- which
          # is also what the archive already says inside, so nothing has to
          # be rewritten and nothing can disagree.
          if os.environ.get("VERSIONED") != "true":
              if not manifest_ver_parsed:
                  die("manifest.json version %r is not X.Y.Z" % manifest_version)
              print("Rolling build at manifest version %s." % manifest_version,
                    file=sys.stderr)
              print("version=%s" % manifest_version)
              print("tag=latest")
              raise SystemExit(0)

          override = os.environ.get("DISPATCH_VERSION", "").strip()
          if not override:
              found = re.search(r"\[release\s+(\d+\.\d+\.\d+)\]", sh("git", "log", "-1", "--pretty=%B"))
              override = found.group(1) if found else ""

          manifest_ver = manifest_ver_parsed
          if override:
              version = parse(override) or die(f"invalid version override {override!r} (expected X.Y.Z)")
              source = "the override"
          elif manifest_ver and (latest is None or manifest_ver > latest):
              version = manifest_ver
              source = "manifest.json"
          elif latest:
              major, minor, patch = latest
              patch += 1
              if patch > 99:
                  minor, patch = minor + 1, 0
              version = (major, minor, patch)
              source = "a patch bump on v%d.%d.%d" % latest
          else:
              die(f"manifest.json version {manifest_version!r} is not X.Y.Z "
                  "and there is no vX.Y.Z tag to count from")

          text = "%d.%d.%d" % version
          print(f"Releasing {text}, from {source}.", file=sys.stderr)
          print(f"version={text}")
          print(f"tag=v{text}")
          PY

      - name: Refuse to clobber an existing release
        if: env.VERSIONED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Pick a different version."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Pick a different version."
            exit 1
          fi

      # continue-on-error, because the whole point of the soft shim job is
      # that a release without a DLL is still a release
      - name: Fetch the shim
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: leiasr-shim
          path: ${{ runner.temp }}/shim

      - name: Build the mod .zip
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MOD_ID: "DRAMATIC_SHAPE"
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/pkg"
          out="$GITHUB_WORKSPACE/dist"
          rm -rf "$staging" "$out"
          mkdir -p "$staging" "$out"

          git archive HEAD | tar -x -C "$staging"

          rm -rf "$staging/.github" "$staging/.vscode" "$staging/.gitattributes" \
                 "$staging/.gitignore" "$staging/.luarc.json"

          # The shim's SOURCE stays in the repository and out of the archive:
          # a player installs a DLL, not the C++ it was built from. (git
          # archive carries no submodule contents either way, so libs/ arrives
          # empty at best.)
          rm -rf "$staging/leiasr_shim" "$staging/libs" "$staging/.gitmodules"

          if [ -f "$RUNNER_TEMP/shim/leiasr_shim.dll" ]; then
            mkdir -p "$staging/assets/leiasr"
            cp "$RUNNER_TEMP/shim/leiasr_shim.dll" "$staging/assets/leiasr/"
            echo "staged leiasr_shim.dll ($(stat -c%s "$staging/assets/leiasr/leiasr_shim.dll") bytes)"
          else
            echo "::warning::No leiasr_shim.dll artifact, so this release ships without the LEIA rung. Every other 3D mode is unaffected."
          fi

          python3 - "$staging/manifest.json" "$VERSION" <<'PY'
          import json, sys
          path, version = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              manifest = json.load(fh)
          manifest["version"] = version
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          PY

          zip_path="$out/${MOD_ID}-${VERSION}.zip"
          (cd "$staging" && zip -qr "$zip_path" .)
          unzip -l "$zip_path"

          unzip -p "$zip_path" manifest.json > "$RUNNER_TEMP/packed-manifest.json"
          python3 - "$RUNNER_TEMP/packed-manifest.json" "$VERSION" <<'PY'
          import json, sys
          path, expected = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              version = json.load(fh)["version"]
          if version != expected:
              raise SystemExit(f"::error::packed manifest says {version}, expected {expected}")
          print(f"manifest.json is at the archive root and reports {version}")
          PY

          (cd "$out" && sha256sum "${MOD_ID}"-*.zip > sha256sums.txt)
          cat "$out/sha256sums.txt"

      # Every run, publishing or not: a branch build is only useful if you can
      # download what it built. Retained briefly, because these are test
      # builds rather than releases.
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: mod-${{ steps.ver.outputs.version }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # ROLLING: one tag, one pre-release, replaced in place every push to the
      # default branch, so there is always exactly one URL holding a current
      # build and it never accumulates.
      #
      # Deleted and recreated rather than edited, and `--cleanup-tag` with it:
      # a release whose tag still points at last week's commit is worse than
      # no release, because the source link lies about what the zip contains.
      # The `|| true` is the first run, where there is nothing to delete.
      - name: Publish the rolling build
        if: env.ROLLING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          MOD_ID: "DRAMATIC_SHAPE"
        run: |
          set -euo pipefail

          shim="present"
          if ! unzip -l "dist/${MOD_ID}-${VERSION}.zip" | grep -q 'leiasr_shim\.dll'; then
            shim="ABSENT -- the LEIA rung will fall back to side by side"
          fi

          cat > /tmp/notes.md <<EOF
          The latest build of \`${GITHUB_REF_NAME}\`, replaced on every push. This
          is a test build rather than a release: it is whatever was on the
          branch a few minutes ago.

          Install it from the game: **MODS > Import mod .zip**.

          - commit \`${GITHUB_SHA}\`
          - mod version \`${VERSION}\`
          - leiasr_shim.dll: ${shim}

          For a version somebody chose to ship, see the tagged releases.
          EOF

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --target "$GITHUB_SHA" \
            --title "Latest build (${VERSION})" \
            --prerelease \
            --notes-file /tmp/notes.md \
            "dist/${MOD_ID}-${VERSION}.zip" \
            "dist/sha256sums.txt"

          echo "Rolling release updated to $GITHUB_SHA"

      - name: Publish GitHub Release
        if: env.VERSIONED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          MOD_ID: "DRAMATIC_SHAPE"
        run: |
          set -euo pipefail

          prev="$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
          range="${prev:+${prev}..}$GITHUB_SHA"
          changes="$(git log --no-merges --pretty='- %s' "$range" | head -50 || true)"

          notes=$'Download the .zip and install it from the game: MODS > Import mod .zip.'
          if [ -n "$changes" ]; then
            notes+=$'\n\n## Changes\n\n'"$changes"
          fi
          printf 'Release notes:\n%s\n' "$notes"

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "$notes" \
            "dist/${MOD_ID}-${VERSION}.zip" \
            "dist/sha256sums.txt"

          echo "Published release $TAG"
